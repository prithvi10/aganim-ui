# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "315cfaf63c9baf27e4ba9a22b91b168e"
name = "CrossBorderAgent"
# IMPORTANT: This must be the app ORIGIN (no path). The embedded entry route can be /app,
# but the app URL itself must match SHOPIFY_APP_URL origin exactly to avoid auth 401 loops.
application_url = "https://aganim-ui.onrender.com"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-01"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "https://aganim-api.onrender.com/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "https://aganim-api.onrender.com/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "app_subscriptions/update" ]
  uri = "https://aganim-api.onrender.com/webhooks/subscription-activated"

  # Mandatory GDPR compliance webhooks (required for App Store review)
  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  uri = "https://aganim-api.onrender.com/api/webhooks/compliance"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_products,write_products,read_locales,read_translations,write_translations,read_files,read_content,write_content"

[auth]
redirect_urls = [ 
  "https://aganim-api.onrender.com/api/auth/callback",
  "https://aganim-ui.onrender.com/auth/callback", 
  "https://aganim-ui.onrender.com/auth/login"
]

[app_proxy]
url = "https://aganim-api.onrender.com/api/proxy"
subpath = "cross-border"
prefix = "apps"
