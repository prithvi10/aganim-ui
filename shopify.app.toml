# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "315cfaf63c9baf27e4ba9a22b91b168e"
name = "CrossBorderAgent"
application_url = "https://shopify-translator-ui.onrender.com"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-01"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "https://shopify-translator-api.onrender.com/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "https://shopify-translator-api.onrender.com/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "app_subscriptions/update" ]
  uri = "https://shopify-translator-api.onrender.com/webhooks/subscription-activated"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_products,write_products,read_locales,read_translations,write_translations,read_files"

[auth]
redirect_urls = [ 
  "https://shopify-translator-api.onrender.com/api/auth/callback",
  "https://shopify-translator-ui.onrender.com/auth/callback", 
  "https://shopify-translator-ui.onrender.com/auth/login"
]

[app_proxy]
url = "https://shopify-translator-api.onrender.com/api/proxy"
subpath = "cross-border"
prefix = "apps"
