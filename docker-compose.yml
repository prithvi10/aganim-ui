services:
  ui-postgres:
    image: postgres:16
    container_name: aganim-ui-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shopify_ui
    ports:
      # Use 5433 to avoid colliding with any existing local Postgres on 5432
      - "5433:5432"
    volumes:
      - ui_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shopify_ui"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  ui_postgres_data:

